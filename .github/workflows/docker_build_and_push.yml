name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Build binary for Linux/amd64
        run: |
          # 确保 quick_build.sh 有执行权限
          chmod +x quick_build.sh
          # 使用 go 环境变量构建 linux/amd64 二进制文件
          GOOS=linux GOARCH=amd64 ./quick_build.sh
          # Dockerfile 期望二进制文件位于 build/linux-amd64/simple-one-api
          mkdir -p build/linux-amd64
          mv simple-one-api build/linux-amd64/simple-one-api

      - name: Determine image tag
        id: set_tag
        run: |
          # 如果是 tag 触发，则提取 tag，否则默认为 latest
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
          else
            TAG=latest
          fi
          echo "IMAGE_TAG=$TAG" >> $GITHUB_ENV
          echo "Using image tag: $TAG"
      
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: xiaotianxt/simple-one-api:${{ env.IMAGE_TAG }}
          build-args: |
            ARCH=amd64 